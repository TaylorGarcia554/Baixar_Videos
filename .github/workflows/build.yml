name: Build instalador (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias (yt-dlp sempre na versao mais nova)
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade pyinstaller customtkinter yt-dlp imageio-ffmpeg pillow certifi

      - name: Gerar o app com PyInstaller
        run: python -m PyInstaller app.spec --noconfirm --clean

      - name: Testar o .exe gerado (falha o build se o app nao abrir)
        shell: pwsh
        run: |
          $p = Start-Process "dist\MioBaixador\MioBaixador.exe" -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Error "App travou/mostrou erro no autoteste"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "Autoteste falhou (codigo $($p.ExitCode))"; exit 1 }
          Write-Output "Autoteste OK"

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar o instalador
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Publicar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: Setup_MioBaixador
          path: Output/Setup_MioBaixador.exe
